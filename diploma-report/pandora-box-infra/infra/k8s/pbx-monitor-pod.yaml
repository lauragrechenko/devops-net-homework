apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: pandora-box
  namespace: pandora-box
  labels:
    app: pandora-box
    # Must match Prometheus's serviceMonitorSelector / podMonitorSelector.
    # Verified with: kubectl -n monitoring get prometheus -o yaml
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: pandora-box
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: 30s
