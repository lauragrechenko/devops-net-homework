# Kubernetes Secrets for PandoraBox
# IMPORTANT: Replace all placeholder values before deploying to production!
# Generate SECRET_KEY_BASE with: mix phx.gen.secret
# Generate PANDORA_KEK with: :crypto.strong_rand_bytes(32) |> Base.encode64()
apiVersion: v1
kind: Secret
metadata:
  name: pandora-box
  namespace: pandora-box
  labels:
    app: pandora-box
type: Opaque
stringData:
  SECRET_KEY_BASE: "your-secret-key-base-at-least-64-chars-long-replace-in-production-please"
  API_TOKEN_PEPPER: "your-api-token-pepper-replace-in-production"
  RELEASE_COOKIE: "pandora_cookie"
  PANDORA_KEK: "cGFuZG9yYV9ib3hfZGV2X2tleV9ub3RfZm9yX3Byb2Q="
  PBX_INIT_SECRET: "k8s-init-secret-change-in-production"

---
apiVersion: v1
kind: Secret
metadata:
  name: pandora-s3
  namespace: pandora-box
  labels:
    app: pandora-box
type: Opaque
stringData:
  S3_ACCESS_KEY: "minio"
  S3_SECRET_KEY: "minio123456"
