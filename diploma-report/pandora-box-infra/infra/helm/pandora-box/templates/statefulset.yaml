apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pandora-box
  namespace: {{ include "pandora-box.namespace" . }}
  labels:
    {{- include "pandora-box.labels" . | nindent 4 }}
spec:
  serviceName: {{ .Values.service.headlessName }}
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "pandora-box.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pandora-box.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      initContainers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: MIX_ENV
              value: "prod"
            - name: RELEASE_DISTRIBUTION
              value: "none"
            - name: RELEASE_COOKIE
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.appName }}
                  key: RELEASE_COOKIE
            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.appName }}
                  key: SECRET_KEY_BASE
            - name: API_TOKEN_PEPPER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.appName }}
                  key: API_TOKEN_PEPPER
            - name: PANDORA_KEK
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.appName }}
                  key: PANDORA_KEK
            - name: SQLITE_DIR
              value: {{ .Values.storagePaths.sqlite | quote }}
            - name: ROCKSDB_DIR
              value: {{ .Values.storagePaths.rocksdb | quote }}
            - name: RA_DIR
              value: {{ .Values.storagePaths.ra | quote }}
            - name: MNESIA_DIR
              value: {{ .Values.storagePaths.mnesia | quote }}
            - name: PBX_CLUSTERS_CONFIG
              value: {{ .Values.storagePaths.clustersConfig | quote }}
            - name: K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: S3_ENABLED
              value: {{ .Values.s3.enabled | quote }}
            - name: S3_SCHEME
              value: {{ .Values.s3.scheme | quote }}
            - name: S3_HOST
              value: {{ .Values.s3.host | quote }}
            - name: S3_PORT
              value: {{ .Values.s3.port | quote }}
            - name: S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.backupsName }}
                  key: BACKUPS_S3_BUCKET_NAME
            - name: S3_REGION
              value: {{ .Values.s3.region | quote }}
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.backupsName }}
                  key: BACKUPS_S3_ACCESS_KEY_ID
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.backupsName }}
                  key: BACKUPS_S3_SECRET_ACCESS_KEY
          command: ["/bin/sh", "-c"]
          args:
            - |
              SVC="{{ .Values.cluster.serviceName }}"
              BASE="{{ .Values.cluster.nodeBasename }}"
              NS="${K8S_NAMESPACE}"
              export RA_MEMBERS="${BASE}@${SVC}-0.${SVC}.${NS}.svc.cluster.local,${BASE}@${SVC}-1.${SVC}.${NS}.svc.cluster.local,${BASE}@${SVC}-2.${SVC}.${NS}.svc.cluster.local"
              echo "Running database migrations..."
              ./bin/pandora_box eval "PandoraBoxBackendSqlite.Migrator.migrate()"
              echo "Migrations completed"
          volumeMounts:
            - name: data
              mountPath: /app/data
      containers:
        - name: pandora-box
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.ports.lid }}
              name: lid
            - containerPort: {{ .Values.service.ports.portal }}
              name: portal
            - containerPort: {{ .Values.service.ports.metrics }}
              name: metrics
            - containerPort: {{ .Values.service.ports.epmd }}
              name: epmd
          env:
            - name: MIX_ENV
              value: "prod"
            - name: RELEASE_DISTRIBUTION
              value: "name"
            - name: RELEASE_COOKIE
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.appName }}
                  key: RELEASE_COOKIE
            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.appName }}
                  key: SECRET_KEY_BASE
            - name: API_TOKEN_PEPPER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.appName }}
                  key: API_TOKEN_PEPPER
            - name: PANDORA_KEK
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.appName }}
                  key: PANDORA_KEK
            - name: PBX_INIT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.appName }}
                  key: PBX_INIT_SECRET
            - name: PHX_SERVER
              value: "true"
            - name: PHX_HOST
              value: {{ .Values.phoenix.host | quote }}
            - name: PHX_SCHEME
              value: {{ .Values.phoenix.scheme | quote }}
            - name: LID_PORT
              value: {{ .Values.phoenix.lidPort | quote }}
            - name: PORTAL_PORT
              value: {{ .Values.phoenix.portalPort | quote }}
            - name: PBX_METRICS_PORT
              value: {{ .Values.service.ports.metrics | quote }}
            - name: K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: K8S_SERVICE_NAME
              value: {{ .Values.cluster.serviceName | quote }}
            - name: K8S_NODE_BASENAME
              value: {{ .Values.cluster.nodeBasename | quote }}
            - name: RA_DIR
              value: {{ .Values.storagePaths.ra | quote }}
            - name: MNESIA_DIR
              value: {{ .Values.storagePaths.mnesia | quote }}
            - name: SQLITE_DIR
              value: {{ .Values.storagePaths.sqlite | quote }}
            - name: ROCKSDB_DIR
              value: {{ .Values.storagePaths.rocksdb | quote }}
            - name: PBX_CLUSTERS_CONFIG
              value: {{ .Values.storagePaths.clustersConfig | quote }}
            - name: S3_ENABLED
              value: {{ .Values.s3.enabled | quote }}
            - name: S3_SCHEME
              value: {{ .Values.s3.scheme | quote }}
            - name: S3_HOST
              value: {{ .Values.s3.host | quote }}
            - name: S3_PORT
              value: {{ .Values.s3.port | quote }}
            - name: S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.backupsName }}
                  key: BACKUPS_S3_BUCKET_NAME
            - name: S3_REGION
              value: {{ .Values.s3.region | quote }}
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.backupsName }}
                  key: BACKUPS_S3_ACCESS_KEY_ID
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.backupsName }}
                  key: BACKUPS_S3_SECRET_ACCESS_KEY
          command: ["/bin/sh", "-c"]
          args:
            - |
              SVC="{{ .Values.cluster.serviceName }}"
              BASE="{{ .Values.cluster.nodeBasename }}"
              NS="${K8S_NAMESPACE}"
              export RA_MEMBERS="${BASE}@${SVC}-0.${SVC}.${NS}.svc.cluster.local,${BASE}@${SVC}-1.${SVC}.${NS}.svc.cluster.local,${BASE}@${SVC}-2.${SVC}.${NS}.svc.cluster.local"
              export RELEASE_NODE="${BASE}@$(hostname -f)"
              echo "Starting PandoraBox node as ${RELEASE_NODE}"
              exec ./bin/pandora_box start
          volumeMounts:
            - name: data
              mountPath: /app/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          {{- toYaml .Values.persistence.accessModes | nindent 10 }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
