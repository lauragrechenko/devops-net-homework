{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ include "pandora-box.namespace" . }}
  labels:
    {{- include "pandora-box.labels" . | nindent 4 }}
{{- end }}
{{- if .Values.rbac.create }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pandora-box-libcluster
  namespace: {{ include "pandora-box.namespace" . }}
  labels:
    {{- include "pandora-box.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "endpoints"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pandora-box-libcluster-binding
  namespace: {{ include "pandora-box.namespace" . }}
  labels:
    {{- include "pandora-box.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pandora-box-libcluster
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount.name }}
{{- end }}
